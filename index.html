.cam .sw{gap:6px}

.sq.empty{background:transparent;color:inherit}
.pal{position:absolute;z-index:8;top:calc(100% + 6px);left:0;display:flex;flex-wrap:wrap;gap:8px;width:max-content;max-width:340px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.pal button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);padding:0}
.pal button.on{outline:3px solid var(--ink);outline-offset:2px}
.pal .nc{background:var(--field);color:var(--mute);font-size:14px;line-height:1}
.cam .sw button{width:22px;height:22px}
.cam input{width:100%;background:transparent;color:inherit;border:0;border-bottom:1px solid rgba(128,128,128,.6);padding:4px 2px;font:600 16px Barlow,Arial,sans-serif;border-radius:0}
.cam input::placeholder{color:inherit;opacity:.5}
.ci{position:relative}
.cimg{width:100%;height:84px;border:1px dashed rgba(128,128,128,.6);border-radius:8px;background:rgba(128,128,128,.12);color:inherit;font-size:13px;padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cimg img{width:100%;height:100%;object-fit:contain;display:block}
.cx{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:0}
@media print{.dlg,.sw1,.cx{display:none!important}}
.row.item.done{border-left-color:#17803f}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:40px;font-size:15px}
.addbar{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:12px;pointer-events:none}
.addbar .add{position:static;transform:none;pointer-events:auto}
.add.alt{background:var(--ink);color:var(--bg)}
@media (max-width:820px){.row.item .txt{grid-column:auto}.row.item .act{grid-column:auto}}
@media (max-width:820px){.row{grid-template-columns:130px 1fr;}.pic{grid-column:2}.cam{grid-column:1/-1}.txt{grid-column:1/-1}.act{grid-column:1/-1;flex-direction:row}}
@media print{header .hb,.add,.act,.gap{display:none}body::before{display:none}header{position:static;overflow:visible;flex-wrap:wrap;background:#fff;color:#000;border-bottom:2px solid #000}header input,header select,header .pn{color:#000}.row{break-inside:avoid}}

var CITIES=[["Praha",50.0755,14.4378],["Brno",49.1951,16.6068],["Ostrava",49.8209,18.2625],["Plzeň",49.7384,13.3736],["Liberec",50.7663,15.0543],["Olomouc",49.5938,17.2509],["České Budějovice",48.9745,14.4743],["Hradec Králové",50.2104,15.8327],["Pardubice",50.0343,15.7812],["Ústí nad Labem",50.6607,14.0323],["Zlín",49.2242,17.6627],["Karlovy Vary",50.2319,12.872],["Jihlava",49.3961,15.5912],["Kutná Hora",49.9484,15.2682],["Český Krumlov",48.8127,14.3175],["Tábor",49.4144,14.6578],["Znojmo",48.8555,16.0488],["Cheb",50.0796,12.3739]];

function mod(a,n){return ((a%n)+n)%n}
function sunUT(y,m,d,lat,lon,rising){
 var R=Math.PI/180,N=Math.floor(275*m/9)-Math.floor((m+9)/12)*(1+Math.floor((y-4*Math.floor(y/4)+2)/3))+d-30;
 var lh=lon/15,t=N+((rising?6:18)-lh)/24,M=0.9856*t-3.289;
 var L=mod(M+1.916*Math.sin(M*R)+0.02*Math.sin(2*M*R)+282.634,360);
 var RA=mod(Math.atan(0.91764*Math.tan(L*R))/R,360);
 RA=(RA+(Math.floor(L/90)*90-Math.floor(RA/90)*90))/15;
 var sd=0.39782*Math.sin(L*R),cd=Math.cos(Math.asin(sd));
 var ch=(Math.cos(90.833*R)-sd*Math.sin(lat*R))/(cd*Math.cos(lat*R));
 if(ch>1||ch<-1)return null;
 var H=(rising?360-Math.acos(ch)/R:Math.acos(ch)/R)/15;
 return mod(H+RA-0.06571*t-6.622-lh,24);
}
function pragueT(ms){return new Intl.DateTimeFormat("cs-CZ",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Prague"}).format(new Date(ms))}
function place(){if(S.loc==="custom")return [S.lat,S.lon];for(var i=0;i<CITIES.length;i++)if(CITIES[i][0]===S.loc)return [CITIES[i][1],CITIES[i][2]];return [50.0755,14.4378]}

 document.getElementById("pn").value=S.name||"";document.title=(S.name?S.name+" – ":"")+"Plán natáčení";
 if(!S.date)S.date=today();if(!S.loc)S.loc="Praha";if(S.lat==null){S.lat=50.0755;S.lon=14.4378}
 document.getElementById("dt").value=S.date;document.getElementById("loc").value=S.loc;
 document.getElementById("cu").style.display=S.loc==="custom"?"flex":"none";
 document.getElementById("lat").value=S.lat;document.getElementById("lon").value=S.lon;
 var p=place(),q=S.date.split("-"),sr="--:--",ss="--:--",dl="--";
 try{var y=+q[0],m=+q[1],d=+q[2],a=sunUT(y,m,d,p[0],p[1],true),b=sunUT(y,m,d,p[0],p[1],false);
 if(a!=null&&b!=null){var base=Date.UTC(y,m-1,d);sr=pragueT(base+a*36e5);ss=pragueT(base+b*36e5);dl=fmt(Math.round((b-a)*60))}}catch(e){}

}
var COLS=[["Červená","#d9433b","#fff"],["Oranžová","#f08a24","#12161c"],["Žlutá","#f2cf2e","#12161c"],["Zelená","#3aa655","#12161c"],["Modrá","#2f6fca","#fff"],["Fialová","#8e5bd0","#fff"],["Růžová","#ec6fa8","#12161c"],["Šedá","#9aa3b0","#12161c"],["Tyrkysová","#1fb5ad","#12161c"],["Světle modrá","#4fb3f0","#12161c"],["Limetková","#a4d233","#12161c"],["Hnědá","#8a5a3c","#fff"],["Bordó","#8c1d40","#fff"],["Tmavě modrá","#1f3a68","#fff"],["Tmavě zelená","#1e6b46","#fff"],["Korálová","#f26b5b","#12161c"],["Broskvová","#f7b27c","#12161c"],["Světle růžová","#f6a6c9","#12161c"],["Levandulová","#b9a2ee","#12161c"],["Indigo","#4a4fd1","#fff"],["Mátová","#7fdcc0","#12161c"],["Světle zelená","#a6dd9b","#12161c"],["Olivová","#7a8b2d","#fff"],["Béžová","#e0cfa0","#12161c"]];
function colStyle(s){for(var i=0;i<COLS.length;i++)if(COLS[i][1]===s.color)return ' style="background:'+COLS[i][1]+';color:'+COLS[i][2]+';border-radius:8px;border-bottom-color:transparent;padding:8px 10px"';return ''}

function camBox(s){var c=posColor(s),o='<option value="">–</option>';for(var n=1;n<=15;n++)o+='<option value="'+n+'"'+(String(s.cam)===String(n)?' selected':'')+'>'+esc(posLabel(n))+'</option>';

function tick(){
 var on=!!S.track,btn=document.getElementById("trk"),ts=document.getElementById("ts"),tst=document.getElementById("tst"),rows=document.querySelectorAll("#list .row");
 btn.textContent="⏱";btn.setAttribute("aria-label",on?"Sledování zapnuto":"Sledovat čas");btn.setAttribute("aria-pressed",on?"true":"false");

 for(var r=0;r<rows.length;r++)rows[r].classList.remove("now");
 if(!on)return;
 var d=new Date(),now=d.getHours()*60+d.getMinutes(),el=document.getElementById("tv"),T=calc(),txt,cls="";

 if(S.date!==today()){el.textContent="Plán není na dnešek";el.className="stat neutral";return}

 if(S.shots.length&&open<0&&!S.shots.every(function(s){return s.type==="item"}))txt="Hotovo · "+txt;
 el.textContent=txt;el.className="stat "+cls;
 S.shots.forEach(function(s,i){if(rows[i]&&now>=T[i].a&&now<T[i].b)rows[i].classList.add("now")});

 el.className="posw"+(open?" on":"");el.innerHTML=open?'<div class="posbox"><div class="posbar"><b>Pozice kamery</b><span class="hint">Napiš popis za písmeno a vyber barvu</span><button class="posbtn" data-act="postoggle">Zavřít</button></div>'+g+'</div>':'';

function buildPrint(){
 var T=calc(),n=0,rows="",d=new Date((S.date||today())+"T12:00:00"),ds=isNaN(d)?(S.date||""):d.toLocaleDateString("cs-CZ",{weekday:"long",day:"numeric",month:"long",year:"numeric"}),loc=S.loc==="custom"?S.lat+", "+S.lon:S.loc,g=function(id){return document.getElementById(id).textContent},nm=S.name||"Plán natáčení";
 var css='body{font-family:-apple-system,Helvetica,Arial,sans-serif;margin:16px;color:#12161c}h1{margin:0 0 4px;font-size:24px}.meta{display:flex;flex-wrap:wrap;gap:4px 20px;color:#444;font-size:13px;margin-bottom:12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #bbb;padding:6px;vertical-align:top;text-align:left}th{background:#eee}tr{break-inside:avoid;page-break-inside:avoid}.tm{white-space:nowrap;font-weight:700;font-size:15px}.tm small,.st small{display:block;font-weight:400;font-size:11px}.im{width:230px}.im img{width:220px;display:block}.pi{width:90px;margin-top:4px}.it td{background:#f1f1f1}@page{size:A4 landscape;margin:10mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}';
 S.shots.forEach(function(s,i){
  var t=toT(T[i].a)+' – '+toT(T[i].b);
  if(s.type==="item"){rows+='<tr class="it"><td class="tm">'+t+'<small>'+s.dur+' min</small></td><td colspan="5">'+esc(s.title||"Položka")+(s.done?' ✓':'')+'</td></tr>';return}
  n++;
  var ci=colorInfo(s.color),pc=s.cam&&S.pos?colorInfo(S.pos[s.cam]):null,pim=s.cam&&S.posImg?S.posImg[s.cam]:"";
  rows+='<tr><td class="tm">'+t+'<small>'+s.dur+' min</small></td><td class="im">'+(s.img?'<img src="'+s.img+'" alt="">':'')+'</td><td'+(ci?' style="background:'+ci[1]+';color:'+ci[2]+'"':'')+'><b>'+n+'.</b> '+esc(s.title)+'</td><td'+(pc?' style="background:'+pc[1]+';color:'+pc[2]+'"':'')+'>'+(s.cam?esc(posLabel(+s.cam)):'')+(pim?'<br><img class="pi" src="'+pim+'" alt="">':'')+(s.camnote?'<br><i>'+esc(s.camnote)+'</i>':'')+'</td><td>'+esc(s.note).replace(/\n/g,'<br>')+(s.sketch?'<br><img style="width:220px;border:1px solid #bbb;margin-top:4px" src="'+s.sketch+'" alt="">':'')+'</td><td class="st">'+(s.done?'NATOČENO'+(s.doneAt?'<small>'+fmtHM(s.doneAt)+'</small>':''):'')+'</td></tr>';
 });
 return '<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(nm)+'</title><style>'+css+'</style></head><body><h1>'+esc(nm)+'</h1><div class="meta"><span>'+esc(ds)+'</span><span>'+esc(loc)+'</span><span>Směna '+S.dayStart+' – '+g("end")+'</span><span>Východ '+g("sr")+' · Západ '+g("ss")+'</span><span>Celkem '+g("tot")+'</span></div><table><thead><tr><th>Čas</th><th>Storyboard</th><th>Záběr</th><th>Kamera</th><th>Poznámky</th><th>Stav</th></tr></thead><tbody>'+rows+'</tbody></table></body></html>';
}
function plainSave(name,data,mime){
 var blob=new Blob([data],{type:mime});
 try{var f=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f],title:name}).catch(function(){})}catch(e){}
 var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);return Promise.resolve()
}
function saveFile(name,data,mime){
 var c=window.claude;
 if(c&&c.use)return c.use("downloads").then(function(dl){if(dl)return dl.save({filename:name,data:data}).then(function(){});return plainSave(name,data,mime)},function(){return plainSave(name,data,mime)}).catch(function(e){if(e&&e.code==="declined")return;ask("Soubor se nepodařilo uložit.","Rozumím",null,false)});
