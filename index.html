function plainSave(name,data,mime){
 var blob=new Blob([data],{type:mime});
 if(window.showSaveFilePicker&&window.top===window){var ex="."+name.split(".").pop();return window.showSaveFilePicker({suggestedName:name,types:[{description:"Soubor",accept:(function(o){o[mime]=[ex];return o})({})}]}).then(function(fh){return fh.createWritable().then(function(w){return w.write(blob).then(function(){return w.close()})})}).catch(function(e){if(e&&e.name==="AbortError")return;return plainSave2(name,blob,mime)})}
 return plainSave2(name,blob,mime)
}
function plainSave2(name,blob,mime){
 try{var f=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f],title:name}).catch(function(){})}catch(e){}
 var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);return Promise.resolve()
}
