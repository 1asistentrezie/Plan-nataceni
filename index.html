<style>

html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Barlow,-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:14px 20px}

.time .dur{font-size:14px;color:var(--mute)}

.pic{aspect-ratio:16/9;background:var(--field);border:1px dashed var(--line);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:14px;cursor:pointer;text-align:center;padding:0;width:100%}

.gaps{display:flex;flex-wrap:wrap;gap:8px 24px}
.txt{display:flex;flex-direction:column;gap:8px;min-width:0}

.txt input{font-weight:600;font-size:19px}
.txt textarea{flex:1;min-height:60px;resize:none;color:var(--mute)}
.txt input:focus,.txt textarea:focus{outline:0;border-bottom-color:var(--acc)}
.gap{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px}
.gap input{width:64px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:15px;background:var(--field);color:var(--ink)}
.act{display:flex;flex-direction:column;gap:8px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.ib{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--field);font-size:18px}
.ib.del{color:var(--del)}
.ib:disabled{opacity:.3}
.add{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--accink);border:0;border-radius:999px;padding:16px 28px;font:700 20px "Barlow Condensed",Arial Narrow,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.hb{border:1px solid rgba(128,128,128,.5);background:transparent;color:inherit;border-radius:8px;padding:8px 14px;font-size:14px}

header input[type=date],header input[type=number],header select{background:transparent;color:inherit;border:1px solid rgba(128,128,128,.5);border-radius:8px;padding:6px 8px;font:600 18px "Barlow Condensed",Arial Narrow,sans-serif}

header select option{color:#000}

.row.item .time input{width:84px;font-size:20px;padding:2px 6px}

header{flex-wrap:nowrap;overflow-x:auto;gap:8px 16px;padding:8px 16px;align-items:center}
header>*{flex:0 0 auto}
header .pn{flex:1 1 180px;min-width:110px;background:transparent;border:0;border-bottom:1px solid rgba(128,128,128,.5);color:inherit;font:700 24px/1.1 "Barlow Condensed",Arial Narrow,sans-serif;padding:2px 0;border-radius:0}

.hrow>:nth-child(1){order:1}
.hrow>:nth-child(2){order:2}
.hrow>:nth-child(3){order:3}
header>:nth-child(2){order:4}
header>:nth-child(3){order:5}
.hrow>:nth-child(4){order:6}
.hrow>:nth-child(5){order:7}

header>:nth-child(5){order:11}

.row.now{box-shadow:0 0 0 3px var(--acc)}

.hrow>:nth-child(5){display:none}
#sr,#ss{font-size:15px;line-height:1.2;border:1px solid rgba(128,128,128,.5);border-radius:6px;padding:2px 6px}
.hrow>:nth-child(4) label,.hrow>:nth-child(5) label{font-size:10px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.dlg.on{display:flex}
.dlg>div{background:var(--card);color:var(--ink);border-radius:14px;padding:22px;max-width:360px;width:100%;text-align:center}

.sw{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw button.on{outline:3px solid var(--ink);outline-offset:2px}
.sw .nc{background:var(--field);font-size:14px;color:var(--mute);line-height:1}
.txt input{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cam{display:flex;flex-direction:column;justify-content:center;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cam .no{font-size:13px;font-weight:600;opacity:.75}
.cam select{width:100%;background:transparent;color:inherit;border:1px solid rgba(128,128,128,.5);border-radius:8px;padding:8px 6px;font:700 22px "Barlow Condensed",Arial Narrow,sans-serif}
.cam select option{color:#000}
.frow{display:flex;align-items:center;gap:8px}
.frow>input,.frow>select{flex:1 1 auto;min-width:0;width:auto}
.frow>.sw1{align-self:center}
body::before{height:calc(env(safe-area-inset-top,0px) + 18px);background:#000}
header{padding:34px 18px 16px;gap:10px 16px}
header .hd label{font-size:12px}
header .hd .big{font-size:22px}
header input[type=time],header input[type=date],header input[type=number],header select{font-size:18px;padding:10px 8px}
header .pn{font-size:28px;padding:8px 0}
header .hb{padding:14px 14px;font-size:16px}
#trk{padding:10px 12px;font-size:22px}
#mn{font-size:17px}
#sr,#ss{font-size:17px;padding:4px 6px}
.stat{font-size:16px;padding:6px 12px}
.sumbox{background:var(--acc);color:#12161c;border-radius:10px;padding:6px 12px;gap:2px}
.sumrow{display:flex;align-items:center;gap:10px;justify-content:space-between}

#mn{position:sticky;right:0;z-index:2;background:var(--ink);font-size:15px}
.menu{display:none;position:fixed;z-index:30;min-width:210px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.menu.on{display:block}
.mi{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:12px 14px;font:600 17px Barlow,Arial,sans-serif;min-height:46px}
.mi:active{background:var(--field)}
.posw{max-width:1280px;margin:0 auto;padding:12px 16px 0}
.posw{display:none}

.posbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.posbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.posbtn{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:8px 14px;font:600 16px Barlow,Arial,sans-serif;min-height:40px}
.pchip{border-radius:8px;padding:6px 12px;font:700 17px/1 "Barlow Condensed",Arial Narrow,sans-serif;background:var(--field);border:1px solid var(--line);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.hint{color:var(--mute);font-size:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px 18px;margin-top:12px}
.prow{display:flex;align-items:center;gap:8px}
.prow .pl,.cam .pl{font:700 20px "Barlow Condensed",Arial Narrow,sans-serif;white-space:nowrap}

@media print{.posbtn,.pgrid,.hint{display:none!important}}
.cam .sw{gap:6px}
.sw1{position:relative;display:inline-block;align-self:flex-start}
.sq{width:30px;height:30px;border-radius:8px;border:2px solid rgba(128,128,128,.6);padding:0;background:var(--field);color:var(--mute);font-size:14px;line-height:1}
.sq.empty{background:transparent;color:inherit}
.pal{position:absolute;z-index:8;top:calc(100% + 6px);left:0;display:flex;flex-wrap:wrap;gap:8px;width:max-content;max-width:300px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 6px 20px rgba(0,0,0,.3)}

.ci{position:relative}

.row.item.done{border-left-color:#17803f}

</style>

<body>
<header>
<input id="pn" class="pn" placeholder="Název projektu" aria-label="Název projektu" maxlength="80">
<div class="hd"><label for="ds">Začátek směny</label><input id="ds" type="time"></div>
<div class="hd"><label>Konec směny</label><span class="big" id="end">--:--</span></div>
<div class="hd sumbox"><div class="sumrow"><label>Celkem</label><span class="big" id="tot">0 min</span></div><div class="sumrow"><label>Zbývá</label><span class="big" id="rem">0 min</span></div></div>
<button class="hb" id="mn" aria-haspopup="true" aria-label="Menu">Menu ▾</button>
<button class="hb" id="trk" aria-pressed="false" aria-label="Sledovat čas" title="Sledovat čas">⏱</button>
<div class="hd" id="ts" style="display:none"><label>Teď</label><span class="big" id="tn">--:--</span></div>
<div class="hd" id="tst" style="display:none"><label>Stav</label><span class="stat neutral" id="tv">–</span></div>
<div class="hrow">
<div class="hd"><label for="dt">Datum</label><input id="dt" type="date"></div>
<div class="hd"><label for="loc">Lokace</label><select id="loc"></select></div>
<div class="hd cu" id="cu" style="display:none"><label for="lat">Šířka</label><input id="lat" type="number" step="any"><label for="lon">Délka</label><input id="lon" type="number" step="any"></div>
<div class="hd sun"><div class="sunrow"><label>Východ</label><span class="big" id="sr">--:--</span></div><div class="sunrow"><label>Západ</label><span class="big" id="ss">--:--</span></div></div>
<div class="hd"><label>Délka dne</label><span class="big" id="dl">--</span></div>
</div>
</header>
<div class="posw" id="pospanel"></div>
<main id="list"></main>
<div class="menu" id="menu" role="menu"><button class="mi" id="add">+ Přidat záběr</button><button class="mi" id="addi">+ Přidat poznámku</button><button class="mi" id="pr">Pozice kamery</button><button class="mi" id="exp">Uložit k tisku</button><button class="mi" id="bk">Zálohovat plán</button><button class="mi" id="ld">Načíst zálohu</button><button class="mi" id="prt" style="display:none">Tisk</button></div>

<script>
var S={dayStart:"08:00",shots:[]},DB=null,pick=null,pickPos=null,openSw=null;
function uid(){return Math.random().toString(36).slice(2,9)}
function toM(t){var p=(t||"0:0").split(":");return (+p[0])*60+(+p[1])}
function toT(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function fmt(m){var h=Math.floor(m/60),r=m%60;return h?h+" h "+(r?r+" min":""):r+" min"}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function newShot(){return {id:uid(),title:"",note:"",img:"",dur:30,gap:0}}
function calc(){var t=toM(S.dayStart);return S.shots.map(function(s){t+=s.gap;var a=t;t+=s.dur;return {a:a,b:t}})}
function save(){try{if(DB){DB.transaction("s","readwrite").objectStore("s").put(JSON.stringify(S),"plan")}else{localStorage.setItem("plan",JSON.stringify(S))}}catch(e){}}
var CITIES=[["Praha",50.0755,14.4378],["Brno",49.1951,16.6068],["Ostrava",49.8209,18.2625],["Plzeň",49.7384,13.3736],["Liberec",50.7663,15.0543],["Olomouc",49.5938,17.2509],["České Budějovice",48.9745,14.4743],["Hradec Králové",50.2104,15.8327],["Pardubice",50.0343,15.7812],["Ústí nad Labem",50.6607,14.0323],["Zlín",49.2242,17.6627],["Karlovy Vary",50.2319,12.872],["Jihlava",49.3961,15.5912],["Kutná Hora",49.9484,15.2682],["Český Krumlov",48.8127,14.3175],["Tábor",49.4144,14.6578],["Znojmo",48.8555,16.0488],["Cheb",50.0796,12.3739]];
document.getElementById("loc").innerHTML=CITIES.map(function(c){return '<option value="'+c[0]+'">'+c[0]+'</option>'}).join("")+'<option value="custom">Vlastní souřadnice</option>';
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

function sunUT(y,m,d,lat,lon,rising){

function saveFile(name,data,mime){
 var c=window.claude;
 if(c&&c.use)return c.use("downloads").then(function(dl){if(dl)return dl.save({filename:name,data:data}).then(function(){});return plainSave(name,data,mime)},function(){return plainSave(name,data,mime)}).catch(function(e){if(e&&e.code==="declined")return;ask("Soubor se nepodařilo uložit.","Rozumím",null,false)});
 return plainSave(name,data,mime);
}
function exportPlan(){saveFile("plan-natoceni.html",buildPrint(),"text/html")}
function backupPlan(){saveFile("plan-natoceni-zaloha-"+today()+".json",JSON.stringify(S),"application/json")}
function restorePlan(f){
 var r=new FileReader();
 r.onload=function(){var d=null;try{d=JSON.parse(r.result)}catch(e){}
  if(!d||!Array.isArray(d.shots)){ask("Soubor není platná záloha plánu.","Rozumím",null,false);return}
  ask("Nahradit současný plán načtenou zálohou?","Načíst",function(){S=d;S.dayStart=S.dayStart||"08:00";save();render()},true)};
 r.readAsText(f);
}
document.getElementById("exp").addEventListener("click",exportPlan);
document.getElementById("bk").addEventListener("click",backupPlan);
document.getElementById("ld").addEventListener("click",function(){document.getElementById("imp").click()});
document.getElementById("imp").addEventListener("change",function(e){var f=e.target.files[0];e.target.value="";if(f)restorePlan(f)});
document.getElementById("prt").addEventListener("click",function(){window.print()});
var PP=document.getElementById("pospanel");
PP.addEventListener("click",function(e){if(e.target===PP){S.posOpen=false;openSw=null;save();renderPanel();return}var b=e.target.closest("[data-act]");if(!b)return;var a=b.dataset.act;
 if(a==="postoggle"){S.posOpen=false;openSw=null;save();renderPanel();return}
 if(a==="swtoggle"){var kp=b.dataset.k;openSw=(openSw===kp)?null:kp;renderPanel();return}
 if(a==="pcolor"){var pn=b.closest(".prow").dataset.n;S.pos=S.pos||{};if(b.dataset.v)S.pos[pn]=b.dataset.v;else delete S.pos[pn];openSw=null;save();render();return}
});
PP.addEventListener("change",function(e){var el=e.target,pn=el.dataset.pn;if(!pn)return;S.posName=S.posName||{};S.posName[pn]=el.value.trim();save();render()});
document.getElementById("trk").addEventListener("click",function(){S.track=!S.track;save();tick()});
setInterval(tick,15000);
function start(raw){
 try{if(raw){var d=JSON.parse(raw);if(d&&d.shots)S=d}}catch(e){}
 if(!S.shots.length&&!raw){S.shots=[newShot(),newShot()];S.shots[0].title="Záběr 1";S.shots[1].title="Záběr 2"}
 render();
}
try{
 var q=indexedDB.open("plan-natoceni",1);
 q.onupgradeneeded=function(){q.result.createObjectStore("s")};
 q.onsuccess=function(){DB=q.result;var g=DB.transaction("s").objectStore("s").get("plan");g.onsuccess=function(){start(g.result)};g.onerror=function(){start(null)}};
 q.onerror=function(){start(localStorage.getItem("plan"))};
}catch(e){var r=null;try{r=localStorage.getItem("plan")}catch(x){}start(r)}
</script>
